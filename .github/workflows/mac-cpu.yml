# CPU on real Macs: Intel and Apple Silicon.
#
# Runs the test harness's --cpu-sweep on GitHub's Intel Mac and Apple
# Silicon Mac, six setups (rates, buffers, stereo, Tail Length) by 15
# situations (start-up, no PA, PA pauses, silent mic, bypass, automation,
# ...). It fails if any situation does more work than steady state (counted
# exactly, the same on every machine). The tables, with CPU time per
# callback for headroom on each kind of Mac, are on the run's summary page.
#
# On pull requests that touch the plugin source, and by hand.

name: Mac CPU

on:
  pull_request:
    paths: ['plugin/Source/**', 'plugin/CMakeLists.txt', '.github/workflows/mac-cpu.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-sweep:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # One architecture per runner, built as released (Release, LTO).
      - name: Build test harness
        run: |
          cmake -S plugin -B plugin/build -DLESSPA_INSTALL_AFTER_BUILD=OFF -DLESSPA_BUILD_LABEL= -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          cmake --build plugin/build --target PAEchoCancellerVerify --parallel

      - name: CPU sweep
        run: |
          exe="$(find plugin/build/PAEchoCancellerVerify_artefacts/Release -type f -perm -u+x | head -n 1)"
          {
            echo "### $(sysctl -n machdep.cpu.brand_string), ${{ matrix.arch }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          set +e
          "$exe" --cpu-sweep | tee sweep.log
          status=${PIPESTATUS[0]}
          set -e
          { cat sweep.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
