# TEMPORARY: CPU benchmark on GitHub's Intel and Apple Silicon Mac runners,
# 1.1.7 (main) against this branch. Removed again before merging.
name: Intel CPU bench

on:
  push:
    branches: [claude/project-thread-ibqyql]
    paths: ['.github/bench/**', '.github/workflows/intel-cpu-bench.yml', 'plugin/Source/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Main tree
        run: |
          git worktree add ../main-tree origin/main
          rm -rf ../main-tree/JUCE && ln -s "$PWD/JUCE" ../main-tree/JUCE
      - name: Patch in the callback benchmark
        run: |
          for t in . ../main-tree; do
            cp .github/bench/bench_callbacks.h "$t/plugin/Source/"
            sed -i '' 's|^int main(int argc, char\* argv\[\]) {|#include "bench_callbacks.h"\
          int main(int argc, char* argv[]) { if (argc >= 2 \&\& std::string(argv[1]) == "--bench-callbacks") return runCallbackBench();|' "$t/plugin/Source/verify_main.cpp"
            grep -n 'bench-callbacks' "$t/plugin/Source/verify_main.cpp"
          done
      - name: Build both
        run: |
          for t in . ../main-tree; do
            cmake -S "$t/plugin" -B "$t/build" -DLESSPA_INSTALL_AFTER_BUILD=OFF -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
            cmake --build "$t/build" --target PAEchoCancellerVerify --parallel
          done
      - name: Bench
        run: |
          exe() { find "$1/build/PAEchoCancellerVerify_artefacts/Release" -type f -perm -u+x | head -n 1; }
          {
            echo "### $(sysctl -n machdep.cpu.brand_string) ($(sysctl -n hw.physicalcpu) cores), ${{ matrix.arch }}"
            echo '```'
            echo "1.1.7 (main):"
            "$(exe ../main-tree)" --bench-callbacks
            echo "this branch:"
            "$(exe .)" --bench-callbacks
            echo "this branch, canceller alone:"
            "$(exe .)" --bench-kalman
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Small-buffer identity test
        run: |
          exe="$(find build/PAEchoCancellerVerify_artefacts/Release -type f -perm -u+x | head -n 1)"
          "$exe" --small-buffers
